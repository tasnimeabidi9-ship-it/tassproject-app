<div class="login-page">
  <div class="ambient-grid" aria-hidden="true">
    <div class="ambient-block b1"></div>
    <div class="ambient-block b2"></div>
    <div class="ambient-block b3"></div>
    <div class="ambient-block b4"></div>
    <div class="ambient-block b5"></div>
    <div class="ambient-block b6"></div>
  </div>

  <div class="login-card">
    <div class="intro-blocks" aria-hidden="true">
      <span class="block bl-a"></span>
      <span class="block bl-b"></span>
      <span class="block bl-c"></span>
      <span class="block bl-d"></span>
      <span class="block bl-e"></span>
    </div>

    <img src="/logo/tplus-logo.jpg" alt="TPLUS INNOVATION" class="logo" />

    <p class="subtitle">Sales CRM &amp; Outreach Platform — sign in to continue</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        <span class="btn-label">{{ loading() ? 'Signing in…' : 'Sign in' }}</span>
      </button>

      <p class="footer-text">Secure access to your CRM dashboard</p>
    </form>
  </div>
</div>
